# 推送到 main 后，把版本号尚未出现在 npm 上的插件包发布出去。
# 认证走 npm trusted publishing（OIDC），仓库里不保存 npm token。
name: Release

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tools/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release.yml"
  # 失败后可以手动重跑，仍只允许从 main 发布。
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing 需要 OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # 发布任务不使用缓存

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # 提交进仓库的构建产物必须与源码重新构建的结果一致。
      - name: Check committed build outputs
        run: git diff --exit-code

      # 只发布 npm 上还没有的版本，其余包跳过。
      - run: pnpm -r publish --no-git-checks
