packages:
  - "plugins/*"

# 所有直接依赖版本在此维护；各包保留自己的依赖声明与独立发布边界。
catalogMode: strict
sharedWorkspaceLockfile: true
catalog:
  "@deepseek-ai/cordis": "4.0.5"
  "@deepseek-ai/dsh-agent": "0.2.1-rc.2"
  "@deepseek-ai/dsh-brand": "0.2.1-rc.2"
  "@deepseek-ai/dsh-client-ui-primitives": "0.2.1-rc.3"
  "@deepseek-ai/dsh-client-ui-theme": "0.2.1-rc.3"
  "@deepseek-ai/dsh-llm": "0.2.1-rc.2"
  "@deepseek-ai/dsh-session": "0.2.1-rc.2"
  "@deepseek-ai/dsh-session-projection": "0.2.1-rc.2"
  "@deepseek-ai/dsh-session-title": "0.2.1-rc.2"
  "@types/hast": "3.0.5"
  "@types/mdast": "4.0.4"
  "@types/node": "24.19.2"
  "@types/react": "18.3.31"
  "@types/react-dom": "18.3.7"
  "@types/semver": "7.8.0"
  "happy-dom": "20.11.6"
  "hast-util-to-jsx-runtime": "2.3.6"
  "html-url-attributes": "3.0.1"
  # 与宿主全局加载的 KaTeX 样式版本保持一致。
  "katex": "0.18.7"
  "marked": "18.1.2"
  "mdast-util-gfm": "3.1.0"
  "mdast-util-math": "3.0.0"
  "mermaid": "11.17.2"
  "micromark-core-commonmark": "2.0.4"
  "micromark-extension-gfm": "3.0.0"
  "micromark-extension-math": "3.1.0"
  "micromark-factory-space": "2.1.0"
  "micromark-util-character": "2.1.1"
  "micromark-util-classify-character": "2.0.1"
  "micromark-util-sanitize-uri": "2.0.1"
  "micromark-util-symbol": "2.0.1"
  "micromark-util-types": "2.0.3"
  "remark-parse": "11.0.0"
  "remark-rehype": "11.1.2"
  "remend": "1.4.0"
  "semver": "7.8.5"
  "typescript": "7.0.2"
  "unified": "11.0.5"
  "unist-util-visit": "5.2.0"
  "vfile": "6.0.3"
  "vite": "8.3.5"

# 宿主兼容范围与开发时安装的精确版本分开维护。
catalogs:
  peers:
    "@deepseek-ai/cordis": "~4.0.5"

allowBuilds:
  # 平台二进制通过 optionalDependencies 安装，不运行安装脚本。
  esbuild: false
