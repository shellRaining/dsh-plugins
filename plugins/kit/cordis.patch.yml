# @shellraining/dsh-kit aggregate patch: mounts every kit plugin into the
# profile roster. @shellraining/dsh-brand is intentionally NOT included:
# it rebrands the UI and stays an opt-in individual install.
#
# DSH allows one asynchronous session-title provider at a time, so the
# shipped model-backed provider is switched off in favour of the layout one.
- id: session-title-llm
  disabled: true

- insert:
    - id: acrylic-wallpaper
      name: '@shellraining/dsh-acrylic-wallpaper'
    - id: local-annotation
      name: '@shellraining/dsh-local-annotation'
    - id: ui-mermaid
      name: '@shellraining/dsh-mermaid'
    - id: session-title-layout
      name: '@shellraining/dsh-session-title-layout'
      config: {}
    - id: side-chat
      name: '@shellraining/dsh-side-chat'
    - id: sidebar-session-preview
      name: '@shellraining/dsh-sidebar-session-preview'
    - id: inline-code-copy
      name: '@shellraining/dsh-inline-code-copy'
